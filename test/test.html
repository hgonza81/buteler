<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página de ejemplo</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 640px;
      margin: 3rem auto;
      padding: 0 1rem;
      line-height: 1.6;
      color: #222;
    }
    h1 { color: #2a5bd7; }
    button {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 6px;
      background: #2a5bd7;
      color: #fff;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>¡Hola, mundo!</h1>
  <p>Esta es una página de ejemplo en <code>/test/test.html</code>.</p>
  <button id="btn">Haz clic aquí</button>
  <p id="msg"></p>
  <script>
    document.getElementById('btn').addEventListener('click', () => {
      document.getElementById('msg').textContent = 'Funciona 🎉';
    });
  </script>
</body>
</html>
